<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eef4f5;
            padding: 30px;
        }

        /* Heading */
        h1 {
            text-align: center;
            color: #123b46;
            font-size: 30px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Add Student Button */
        body > a {
            display: block;
            width: fit-content;
            margin: 0 auto 30px;
            text-decoration: none;
        }

        button {
            padding: 12px 22px;
            background-color: #008b8b;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #006666;
            transform: scale(1.04);
        }

        /* Student Container */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            width: 100%;
        }

        /* Student Card */
        .card {
            width: 280px;
            min-height: 400px;
            border: none;
            border-radius: 12px;
            padding: 18px;
            background-color: white;
            box-shadow: 0 4px 12px rgba(18, 59, 70, 0.10);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
            box-shadow: 0 8px 20px rgba(0, 139, 139, 0.20);
        }

        /* Student Image */
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 9px;
            margin-bottom: 15px;
            background-color: #dce9e9;
        }

        /* Student Details */
        .card h3 {
            color: #123b46;
            font-size: 18px;
            margin: 12px 0;
        }

        .card p {
            color: #52666b;
            margin: 12px 0;
            font-size: 15px;
        }

        /* Student Links */
        .card a {
            display: inline-block;
            margin-top: 15px;
            margin-right: 5px;
            padding: 9px 18px;
            background-color: #008b8b;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }

        .card a:hover {
            background-color: #006666;
        }

        /* Delete Button */
        .card a:last-child {
            background-color: #e76f51;
        }

        .card a:last-child:hover {
            background-color: #c0392b;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 23px;
            }

            .card {
                width: 100%;
                max-width: 350px;
            }
        }

    </style>
</head>

<body>

    <h1>Student Management System</h1>

    <a href="/student/add">
        <button>Add A Student +</button>
    </a>

    <div class="container">

        {% for std in stds %}

        <div class="card">

            <img src="{{std[6]}}" alt="Student Picture">

            <h3>Name : {{std[1]}}</h3>

            <p>Age : {{std[2]}}</p>

            <p>Gender : {{std[3]}}</p>

            <p>Marks : {{std[4]}}</p>

            <a href="/students/{{std[0]}}">View</a>

            <a href="/std/{{std[0]}}">Delete</a>
            <a href="/sdts/update/{{std[0]}}">Update</a>

        </div>

        {% endfor %}

    </div>

</body>
</html>
