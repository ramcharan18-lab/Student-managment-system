<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eef4f5;
            padding: 30px;
        }

        /* Student Details Card */
        .card {
            width: 350px;
            min-height: 480px;
            border: none;
            border-radius: 12px;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 5px 18px rgba(18, 59, 70, 0.12);
            margin: 30px auto;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
            box-shadow: 0 8px 20px rgba(0, 139, 139, 0.20);
        }

        /* Student Image */
        .card img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50px;
            margin-bottom: 18px;
            background-color: #dce9e9;
            border: 2px solid;
            margin-left: 57px;
        }

        /* Student Information */
        h3 {
            color: #123b46;
            font-size: 19px;
            margin: 14px 0;
        }

        p {
            color: #52666b;
            font-size: 15px;
            margin: 14px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #edf1f1;
        }

        /* Attendance Status */
        .status {
            padding: 11px;
            text-align: center;
            color: white;
            border-radius: 7px;
            margin-top: 18px;
            font-weight: bold;
            border: none;
        }

        .present {
            background-color: #008b8b;
        }

        .absent {
            background-color: #e76f51;
        }

        /* Home Button */
        .home {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            padding: 10px 25px;
            background-color: #008b8b;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            transition: 0.3s;
        }

        .home:hover {
            background-color: #006666;
            transform: scale(1.04);
        }

        /* Responsive Design */
        @media (max-width: 450px) {
            body {
                padding: 15px;
            }

            .card {
                width: 100%;
                max-width: 350px;
            }
        }
        h1{
            display: flex;
            justify-content: center;
        }

    </style>
</head>

<body>
    <h1>Details of student {{std[1]}}</h1>

    <div class="card">

        <img src="{{std[6]}}" alt="Student Picture">

        <h3>Name : {{std[1]}}</h3>

        <p>Age : {{std[2]}}</p>

        <p>Gender : {{std[3]}}</p>

        <p>Marks : {{std[4]}}</p>

        <p>Course : {{std[5]}}</p>

        {% if std[7] %}
            <p class="status present">Present</p>
        {% else %}
            <p class="status absent">Absent</p>
        {% endif %}

        <a href="/" class="home">← Back to Home</a>

    </div>

</body>
</html>
